[project]
name = "myst-web"
version = "0.1.0"
description = "Myst: FastAPI + HTMX web interface for managing Forgejo repositories"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.136.0",
    "pydantic-settings>=2.13.1",
    "pydantic[email]>=2.13.2",
    "sqlalchemy[asyncio]>=2.0.49",
]

[dependency-groups]
dev = [
    "uvicorn[standard]>=0.44.0",
]
