                   height="16"
                   class="size-4 shrink-0 brightness-0 invert"
                   aria-hidden="true" />
              <span>Sign In with Forgejo</span>
            </a>
          {% endif %}
        </div>
      </div>
    </header>
    <main id="main"
          class="{% block main_class %}flex-1 w-full px-4 py-8 mx-auto max-w-7xl sm:px-8{% endblock %}">
      {% block content %}{% endblock %}
    </main>
    {% if debug %}
      <!-- Live reload for CSS changes (development only; gated on the debug flag) -->
      <script>
      let lastCssMtime = null;

      async function checkForCssChanges() {
        try {
          const response = await fetch('/api/dev/css-mtime');
          const data = await response.json();

          if (lastCssMtime === null) {
            lastCssMtime = data.mtime;
          } else if (data.mtime > lastCssMtime) {
            lastCssMtime = data.mtime;
            location.reload();
          }
        } catch (err) {
          // Endpoint unavailable — stop polling rather than spamming errors.
        }
      }

      // Check every second.
      setInterval(checkForCssChanges, 1000);
      </script>
    {% endif %}
  </body>
</html>
