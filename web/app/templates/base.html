<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Myst{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/output.css">
  <script src="https://unpkg.com/htmx.org@2"></script>
</head>
<body class="bg-surface text-text min-h-screen">
  <header class="border-b border-border-light">
    <div class="mx-auto max-w-6xl flex items-center justify-between px-4 py-3">
      <a href="/" class="text-xl font-bold text-primary hover:text-primary-hover">Myst</a>
      <nav class="flex items-center gap-4">
        {% if user %}
          <a href="/dashboard" class="text-text-muted hover:text-text transition">Dashboard</a>
          <a href="/auth/logout" class="rounded bg-primary px-3 py-1.5 text-sm font-medium text-white hover:bg-primary-hover transition">Logout</a>
        {% else %}
          <a href="/auth/login/forgejo" class="rounded bg-primary px-3 py-1.5 text-sm font-medium text-white hover:bg-primary-hover transition">Sign in with Forgejo</a>
        {% endif %}
      </nav>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-8">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
