<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}Myst{% endblock %}
    </title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet" />
    <link rel="stylesheet" href="/static/css/output.css" />
    <script src="https://unpkg.com/htmx.org@2"></script>
  </head>
  <body class="min-h-screen bg-surface text-sm text-text antialiased">
    <header class="border-b border-border bg-surface-bright">
      <div class="mx-auto flex max-w-[1280px] items-center justify-between px-4 py-3 sm:px-8">
        <a href="/"
           class="flex items-center gap-2 text-base font-semibold tracking-normal text-text transition hover:text-primary">
          <span class="grid size-7 place-items-center rounded-md border border-primary/20 bg-primary text-xs font-semibold text-white">M</span>
          <span>Myst</span>
        </a>
        <nav class="flex items-center gap-2">
          {% if user %}
            <a href="/dashboard"
               class="rounded-md px-3 py-2 text-sm font-medium text-text-muted transition hover:bg-surface-hover hover:text-text">Dashboard</a>
            <a href="/auth/logout"
               class="rounded-md border border-border bg-white px-3 py-2 text-sm font-medium text-text-muted transition hover:border-outline hover:text-text">Logout</a>
          {% else %}
            <a href="/auth/login/forgejo"
               class="inline-flex items-center gap-2 rounded-md bg-primary px-3 py-2 text-sm font-medium text-white transition hover:bg-primary-hover focus:ring-2 focus:ring-primary-muted">
              <span class="grid size-5 place-items-center rounded-sm bg-white p-0.5">
                <img src="http://myst-forgejo-pk9mpr-31e452-76-13-111-87.sslip.io/assets/img/logo.svg"
                     alt=""
                     width="16"
                     height="16"
                     class="size-4"
                     aria-hidden="true" />
              </span>
              <span>Sign in with Forgejo</span>
            </a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main class="mx-auto max-w-[1280px] px-4 py-8 sm:px-8">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
