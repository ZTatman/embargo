{% extends "base.html" %}

{% block title %}Myst{% endblock %}

{% block content %}
<div class="flex flex-col items-center justify-center py-24 text-center">
  <h1 class="text-5xl font-bold text-white">Myst</h1>
  <p class="mt-4 text-lg text-text-muted max-w-md">
    Share self-hosted repository snapshots via time-limited, view-only links.
  </p>
  {% if not user %}
    <a href="/auth/login/forgejo" class="mt-8 rounded-lg bg-primary px-6 py-3 font-medium text-white hover:bg-primary-hover transition">
      Sign in with Forgejo
    </a>
  {% endif %}
</div>
{% endblock %}
