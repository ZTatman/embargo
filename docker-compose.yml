services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://myst:myst@db:5432/myst_db
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myst
      POSTGRES_PASSWORD: myst
      POSTGRES_DB: myst_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myst -d myst"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: