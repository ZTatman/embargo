services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - private

  forgejo:
    image: codeberg.org/forgejo/forgejo:11.0.11
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - postgres
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - forgejo-data:/data
    networks:
      - private

  myst:
    image: node:22-alpine
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - forgejo
    ports:
      - "4000:4000"
    environment:
      MYST_DOMAIN: myst.example.com
    networks:
      - private
      - public

networks:
  private:
    internal: true
  public:

volumes:
  postgres-data:
  forgejo-data:
